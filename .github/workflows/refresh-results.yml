name: Refresh Results

# Scheduled live refresh: re-scrape fixtures + standings from FBref, rebuild the
# dbt marts, and commit the updated DuckDB so the deployed app (Render, which
# reads the committed warehouse) redeploys with fresh scores/standings.
#
# Runs every 6 hours during the tournament; also runnable on demand.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # FBref is fetched through a headless browser (Cloudflare bypass).
      - uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pip install -e .

      # Sequential — DuckDB allows a single writer, so these must not overlap.
      - name: Refresh fixtures
        run: dagster asset materialize -m wc2026.definitions --select raw_fixtures
      - name: Refresh group standings
        run: dagster asset materialize -m wc2026.definitions --select raw_group_standings
      - name: Rebuild dbt marts
        run: dagster asset materialize -m wc2026.definitions --select dbt_marts

      - name: Commit refreshed warehouse (if changed)
        run: |
          git config user.name "wc2026-results-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/wc2026.duckdb
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "chore: scheduled results refresh [skip ci]"
            git push
          fi
