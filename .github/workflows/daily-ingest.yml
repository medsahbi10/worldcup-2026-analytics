name: Daily Ingest

# GitHub Actions is the *clock*; Dagster owns the asset graph it triggers.
on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC daily
  workflow_dispatch: {} # allow manual runs

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      WC_ENV: cloud # write to MotherDuck so data persists between runs
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Materialize all assets
        run: dagster asset materialize -m wc2026.definitions --select "*"
